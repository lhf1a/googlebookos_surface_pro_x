# SQ2 UE/Unity Game Optimizer configuration
# Changes are hot-reloaded by sq2-game-optd; Zygisk hooks read on process launch.

enabled=1
boost_cpu=1
boost_gpu=1
pin_threads=1
mailbox_present_mode=1
egl_swap_interval_zero=1
poll_interval_ms=250

# Optional comma-separated package patterns (exact or trailing *) for games that
# rename engine libraries or use custom renderers.
extra_apps=com.kurogame.*

# Optional comma-separated package patterns to never optimize.
exclude_apps=
