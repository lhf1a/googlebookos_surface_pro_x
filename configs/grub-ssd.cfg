insmod part_gpt
insmod fat
insmod gzio
set timeout=3
set default=0

menuentry '1. Googlebook OS - SQ2 SSD persistent system' --id googlebook-ssd {
    search --no-floppy --fs-uuid --set=root B026-1027
    devicetree /boot/sq2-android1/sc8180x-surface-pro-x.dtb
    linux /boot/sq2-android1/Image efi=novamap clk_ignore_unused pd_ignore_unused console=tty0 loglevel=6 panic=0 sq2.native=ssd lsm=selinux enforcing=0 printk.devkmsg=on
    initrd /boot/sq2-android1/native-combined-initramfs.cpio.gz
}
menuentry '2. SQ2 SSD rescue - SSH and logs' --id sq2-ssd-rescue {
    search --no-floppy --fs-uuid --set=root B026-1027
    devicetree /boot/sq2-android1/sc8180x-surface-pro-x.dtb
    linux /boot/sq2-android1/Image efi=novamap clk_ignore_unused pd_ignore_unused console=tty0 loglevel=6 panic=0 sq2.native=ssd sq2.rescue=1 lsm=selinux enforcing=0 printk.devkmsg=on
    initrd /boot/sq2-android1/native-combined-initramfs.cpio.gz
}
menuentry '3. Power off' { halt }
