insmod part_gpt
insmod fat
insmod gzio
set timeout=5
set default=sq2-qcom
menuentry 'Qualcomm Vulkan (experimental SQ2)' --id sq2-qcom {
 search --no-floppy --fs-uuid --set=root B026-1027
 devicetree /boot/sq2-android1/sc8180x-surface-pro-x.dtb
 linux /boot/sq2-android1/Image efi=novamap clk_ignore_unused pd_ignore_unused console=tty0 loglevel=6 panic=0 sq2.native=ssd sq2.storage=nvme suspend.screen_only=1 nohibernate sq2.audio=1 nvme_core.default_ps_max_latency_us=0 lsm=selinux enforcing=0 printk.devkmsg=on
 initrd /boot/sq2-android1/native-combined-initramfs.cpio.gz
}
menuentry 'Turnip Vulkan (experimental SQ2)' --id sq2-turnip {
 search --no-floppy --fs-uuid --set=root B026-1027
 devicetree /boot/sq2-android1/sc8180x-surface-pro-x.dtb
 linux /boot/sq2-android1/Image efi=novamap clk_ignore_unused pd_ignore_unused console=tty0 loglevel=6 panic=0 sq2.native=ssd sq2.storage=nvme suspend.screen_only=1 nohibernate sq2.audio=1 nvme_core.default_ps_max_latency_us=0 lsm=selinux enforcing=0 printk.devkmsg=on sq2.vulkan=mesa
 initrd /boot/sq2-android1/native-combined-initramfs.cpio.gz
}
menuentry 'Rescue - SSH' --id sq2-rescue {
 search --no-floppy --fs-uuid --set=root B026-1027
 devicetree /boot/sq2-android1/sc8180x-surface-pro-x-rescue.dtb
 linux /boot/sq2-android1/Image efi=novamap clk_ignore_unused pd_ignore_unused console=tty0 loglevel=6 panic=0 sq2.native=ssd sq2.storage=nvme suspend.screen_only=1 nohibernate sq2.audio=1 nvme_core.default_ps_max_latency_us=0 lsm=selinux enforcing=0 printk.devkmsg=on sq2.rescue=1 sq2.cpufreq=0
 initrd /boot/sq2-android1/native-combined-initramfs.cpio.gz
}
menuentry 'Power off' { halt }
