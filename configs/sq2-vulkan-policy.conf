# Default Dual-Vulkan routing policy for SQ2Hyb (/vendor/etc/sq2-vulkan-policy.conf)
# Priority order in vulkan.freedreno.so (SQ2VkRouter):
#   1. Env SQ2_VULKAN_DRIVER=turnip|qcom (non-setuid processes)
#   2. Kernel cmdline sq2.rescue=1 or sq2.vulkan.force=turnip|qcom
#      (Note: boot token sq2.vulkan=mesa is NOT treated as an override)
#   3. Zygote / USAP preload guard (forced turnip, uncached across fork)
#   4. System properties: debug.sq2.vulkan.{turnip_apps,qcom_apps} > persist.*
#   5. System properties: debug.sq2.vulkan.type.<type> > persist.*
#   6. System properties: debug.sq2.vulkan.driver > persist.*
#      (system UID < 10000 stays on turnip unless debug.sq2.vulkan.include_system=1)
#   7. This policy file: app <pattern> = ... > type <type> = ... > default = ...
#   8. Fallback default: turnip

# Per-app overrides (exact package/process name or trailing * prefix match)
app com.android.chrome = turnip
app com.chrome.* = turnip
app com.google.android.webview = turnip
app com.android.webview = turnip
app com.android.systemui = turnip
app com.kurogame.* = qcom

# Per-type defaults
type system = turnip
type system_ui = turnip
type browser = turnip
type emulator_vk13 = turnip
type benchmark = turnip
type unity = turnip
type unreal = turnip
type generic = turnip

default = turnip
