# New devices start with identity coordinates. First-run calibration stores
# per-device values in Android data; never ship one machine's measured curve.
# --touch-calibration off omits calibration and first-run onboarding.
[Touchscreen]
CalibrationX =
CalibrationY =
CalibrationXTop =
CalibrationTopStart = 0.1
CalibrationTopEnd = 0.3
