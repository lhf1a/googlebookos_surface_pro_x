
menuentry '1. Googlebook native USB boot - AUTO LOGS' --id googlebook-native {
    search --no-floppy --set=root --file /SQ2-PROBE-MEDIA.txt
    devicetree /boot/sq2-android1/sc8180x-surface-pro-x.dtb
    linux /boot/sq2-android1/Image efi=novamap clk_ignore_unused pd_ignore_unused console=tty0 loglevel=6 panic=0 sq2.native=usb lsm=selinux enforcing=0 printk.devkmsg=on
    echo 'Original Googlebook Android init becomes PID 1. Internal NVMe disabled.'
    echo 'Logs save automatically to SQ2PROBE/logs/googlebook-native-*.'
    initrd /boot/sq2-android1/native-combined-initramfs.cpio.gz
}
