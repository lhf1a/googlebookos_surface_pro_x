insmod part_gpt
insmod part_msdos
insmod fat
insmod gzio
set timeout=20
set default=0

menuentry '1. SQ2 touch / touchpad / battery / RTC - automatic logs' {
    search --no-floppy --set=root --file /SQ2-PROBE-MEDIA.txt
    devicetree /boot/sq2-test2/sc8180x-surface-pro-x.dtb
    linux /boot/sq2-test2/Image efi=novamap clk_ignore_unused pd_ignore_unused console=tty0 loglevel=5 panic=0 sq2.test=input
    echo 'Loading test2. Follow the on-screen touchscreen / touchpad / charger prompts.'
    initrd /boot/sq2-test2/initramfs.cpio.gz
}
menuentry '2. SQ2 GPU driver and memory test - automatic logs' {
    search --no-floppy --set=root --file /SQ2-PROBE-MEDIA.txt
    devicetree /boot/sq2-test2/sc8180x-surface-pro-x.dtb
    linux /boot/sq2-test2/Image efi=novamap clk_ignore_unused pd_ignore_unused console=tty0 loglevel=5 panic=0 sq2.test=gpu
    echo 'GPU test. If screen blanks, wait at least 150 seconds for checkpoint logs.'
    initrd /boot/sq2-test2/initramfs.cpio.gz
}
menuentry '3. SQ2 Wi-Fi connect configured lab Wi-Fi - automatic logs' {
    search --no-floppy --set=root --file /SQ2-PROBE-MEDIA.txt
    devicetree /boot/sq2-test2/sc8180x-surface-pro-x.dtb
    linux /boot/sq2-test2/Image efi=novamap clk_ignore_unused pd_ignore_unused console=tty0 loglevel=5 panic=0 sq2.test=wifi
    echo 'Loading Wi-Fi services and modem firmware; allow extra time...'
    initrd /boot/sq2-test2/initramfs.cpio.gz /boot/sq2-test2/wifi-addon.cpio.gz
}
menuentry '4. SQ2 baseline - previously booted successfully' {
    search --no-floppy --set=root --file /SQ2-PROBE-MEDIA.txt
    devicetree /boot/sq2-probe/sc8180x-surface-pro-x.dtb
    linux /boot/sq2-probe/Image efi=novamap clk_ignore_unused pd_ignore_unused console=tty0 loglevel=7 panic=0
    initrd /boot/sq2-probe/initramfs.cpio.gz
}
menuentry '5. Power off' { halt }
