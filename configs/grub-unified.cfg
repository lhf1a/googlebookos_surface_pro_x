insmod part_gpt
insmod part_msdos
insmod fat
insmod gzio
set timeout=15
set default=0

menuentry '1. SQ2 - MULTITOUCH + SSH - AUTO LOGS' {
    search --no-floppy --set=root --file /SQ2-PROBE-MEDIA.txt
    devicetree /boot/sq2-test2/sc8180x-surface-pro-x.dtb
    linux /boot/sq2-test2/Image efi=novamap clk_ignore_unused pd_ignore_unused console=tty0 loglevel=5 panic=0 sq2.test=pending
    echo 'Wi-Fi connects for SSH. Move TWO fingers together when prompted.'
    echo 'Validated basic touch, touchpad, power/RTC, GPU and Wi-Fi tests are skipped.'
    initrd /boot/sq2-test2/initramfs.cpio.gz /boot/sq2-test2/wifi-addon.cpio.gz
}
menuentry '2. SQ2 baseline - previously booted successfully' {
    search --no-floppy --set=root --file /SQ2-PROBE-MEDIA.txt
    devicetree /boot/sq2-probe/sc8180x-surface-pro-x.dtb
    linux /boot/sq2-probe/Image efi=novamap clk_ignore_unused pd_ignore_unused console=tty0 loglevel=7 panic=0
    initrd /boot/sq2-probe/initramfs.cpio.gz
}
menuentry '3. Power off' { halt }
