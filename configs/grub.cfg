insmod part_gpt
insmod part_msdos
insmod fat
insmod gzio
set timeout=20
set default=0

menuentry 'SQ2 probe - device tree, firmware framebuffer' {
    search --no-floppy --set=root --file /SQ2-PROBE-MEDIA.txt
    devicetree /boot/sq2-probe/sc8180x-surface-pro-x.dtb
    linux /boot/sq2-probe/Image efi=novamap clk_ignore_unused pd_ignore_unused console=tty0 loglevel=7 ignore_loglevel panic=0
    echo 'Loading diagnostic initramfs; this can take a while on Surface UEFI...'
    initrd /boot/sq2-probe/initramfs.cpio.gz
}

menuentry 'SQ2 probe - ACPI fallback, limited devices' {
    search --no-floppy --set=root --file /SQ2-PROBE-MEDIA.txt
    linux /boot/sq2-probe/Image efi=novamap clk_ignore_unused acpi=force console=tty0 loglevel=7 ignore_loglevel panic=0
    initrd /boot/sq2-probe/initramfs.cpio.gz
}

menuentry 'Power off' {
    halt
}
