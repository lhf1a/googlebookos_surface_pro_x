insmod part_gpt
insmod fat
insmod gzio
set timeout=3
set default=sq2-internal

menuentry '1. Googlebook OS - SQ2 NVMe + experimental audio' --id sq2-internal {
    search --no-floppy --fs-uuid --set=root B027-0512
    devicetree /boot/sq2-android1/sc8180x-surface-pro-x.dtb
    linux /boot/sq2-android1/Image efi=novamap clk_ignore_unused pd_ignore_unused console=tty0 loglevel=6 panic=0 sq2.native=ssd sq2.storage=nvme suspend.screen_only=1 nohibernate sq2.audio=1 nvme_core.default_ps_max_latency_us=0 lsm=selinux enforcing=0 printk.devkmsg=on
    initrd /boot/sq2-android1/native-combined-initramfs.cpio.gz
}
menuentry '2. SQ2 NVMe rescue - SSH and logs' --id sq2-rescue {
    search --no-floppy --fs-uuid --set=root B027-0512
    devicetree /boot/sq2-android1/sc8180x-surface-pro-x.dtb
    linux /boot/sq2-android1/Image efi=novamap clk_ignore_unused pd_ignore_unused console=tty0 loglevel=6 panic=0 sq2.native=ssd sq2.storage=nvme suspend.screen_only=1 nohibernate sq2.rescue=1 nvme_core.default_ps_max_latency_us=0 lsm=selinux enforcing=0 printk.devkmsg=on
    initrd /boot/sq2-android1/native-combined-initramfs.cpio.gz
}
menuentry '3. Power off' { halt }
